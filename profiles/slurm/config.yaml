# Snakemake (>= 8) profile for a SLURM cluster (needs snakemake-executor-plugin-slurm).
# Before the first run, replace the three placeholders below with your cluster's values:
#   YOUR_ACCOUNT        SLURM account            (sacctmgr show assoc user=$USER format=account,partition)
#   YOUR_CPU_PARTITION  partition for CPU jobs   (STAR, RSEM, kallisto, plink2, Python scripts)
#   YOUR_GPU_PARTITION  partition with GPUs      (tensorQTL; one GPU per job)
executor: slurm
jobs: 250                          # max jobs submitted to SLURM at once
software-deployment-method: conda
latency-wait: 120
keep-going: true
rerun-incomplete: true
printshellcmds: true
max-jobs-per-timespan: "10/2s"
max-status-checks-per-second: 5

default-resources:
  slurm_account: "YOUR_ACCOUNT"
  slurm_partition: "YOUR_CPU_PARTITION"
  mem_mb: 8000
  runtime: 120

set-resources:
  tensorqtl_cis:
    slurm_partition: "YOUR_GPU_PARTITION"
    slurm_extra: "'--gres=gpu:1'"
  tensorqtl_cis_independent:
    slurm_partition: "YOUR_GPU_PARTITION"
    slurm_extra: "'--gres=gpu:1'"
  tensorqtl_cis_nominal:
    slurm_partition: "YOUR_GPU_PARTITION"
    slurm_extra: "'--gres=gpu:1'"
  tensorqtl_trans:
    slurm_partition: "YOUR_GPU_PARTITION"
    slurm_extra: "'--gres=gpu:1'"
